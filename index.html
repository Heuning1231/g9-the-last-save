<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G9 — The Last Save</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 24px;
  background: radial-gradient(ellipse, #293950, #080C16 75%);
  color: #DCE8F4;
  font-family: Arial, sans-serif;
}
h1 {
  font-size: clamp(70px, 18vw, 130px);
  margin: 20px 0 0;
  letter-spacing: -5px;
}
h2 {
  font-size: clamp(24px, 6vw, 40px);
  letter-spacing: 5px;
  margin: 0;
}
small {
  color: #9278ED;
  letter-spacing: 4px;
  font-family: monospace;
}
p {
  color: #A6B5C8;
  line-height: 1.8;
}
.status {
  margin-top: 30px;
  color: #9278ED;
  font-family: monospace;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  50% { opacity: 0.4; }
}
</style>
</head>
<body>
<div>
  <small>GRADUATION ARCHIVE / 2026</small>
  <h1>G9</h1>
  <h2>THE LAST SAVE</h2>
  <p>Software Engineering<br>2024 — 2026</p>
  <p>Some memories never log out.</p>
  <div class="status">
