<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080C16">
  <title>G9 — The Last Save (2024–2026)</title>
  <link rel="stylesheet" href="./assets/css/styles.css?v=lastsave2">
  <style>
/* Last Save final hub and open memory field */
.final-hub{max-width:640px;margin:0 auto}.g9-node-map{position:relative;width:min(100%,480px);height:350px;margin:12px auto 20px;isolation:isolate;background:radial-gradient(ellipse at center,#6960ca23,transparent 70%)}.g9-node-map>svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 8px #8178ee88);pointer-events:none}.map-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-5deg);width:90px;height:90px;display:grid;place-content:center;border:1px solid #a1b7e6;background:linear-gradient(145deg,#62789e,#18263f 40%,#242047);box-shadow:0 0 40px #7972ed55,inset 0 0 14px #c0d2f229;font:bold 29px monospace;color:#f2f5ff;clip-path:polygon(16% 0,84% 0,100% 16%,100% 84%,84% 100%,16% 100%,0 84%,0 16%)}.map-core small{font:9px monospace;color:#92e0d3;letter-spacing:.15em}.map-node{position:absolute;transform:translate(-50%,-50%);width:43%;max-width:170px;min-height:105px;padding:10px 5px;border:1px solid #8799cd88;clip-path:polygon(8% 0,92% 0,100% 12%,100% 88%,92% 100%,8% 100%,0 88%,0 12%);background:linear-gradient(135deg,#263c5a,#181b36);color:#e7efff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:inset 0 0 20px #8a85ff22}.map-node i{font:10px monospace;color:#ac9bff}.map-node strong{font-size:14px;line-height:1.25}.map-node small{font:8px monospace;color:#b6c8e5;letter-spacing:.06em}.map-node:hover,.map-node:focus-visible{background:linear-gradient(135deg,#35476d,#443779);outline:2px solid #a897ff}.map-node.n1{left:24%;top:23%}.map-node.n2{left:76%;top:23%}.map-node.n3{left:24%;top:80%}.map-node.n4{left:76%;top:80%}.free-field{position:relative;height:clamp(330px,58svh,560px);overflow:hidden;touch-action:none;cursor:grab;user-select:none;background:radial-gradient(ellipse at center,#35326655,transparent 75%),linear-gradient(#5c77b018 1px,transparent 1px),linear-gradient(90deg,#5c77b018 1px,transparent 1px),#0c1427;background-size:auto,40px 40px,40px 40px;border:1px solid #51688c;border-radius:12px;box-shadow:inset 0 0 45px #040813}.free-field:active{cursor:grabbing}.free-field #free-layer{position:absolute;inset:0}.data-memory{position:absolute;left:0;top:0;width:132px;padding:5px 5px 9px;background:linear-gradient(145deg,#324561,#121e35);border:1px solid #91abd0a0;box-shadow:0 12px 22px #030712a0,0 0 12px #8e7ee533;will-change:transform;color:#e2edff;cursor:pointer}.data-memory img{width:100%;aspect-ratio:1.12;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}.data-memory span,.data-grid-card span{display:block;font:9px monospace;padding-top:6px;letter-spacing:.05em}.all-data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}.all-data-grid.hidden{display:none}.data-grid-card{padding:4px;background:#17243c;border:1px solid #55678b;color:#e2edff}.data-grid-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}@media(max-width:380px){.g9-node-map{height:300px}.map-node{min-height:89px}.map-node strong{font-size:12px}.map-core{width:70px;height:70px;font-size:22px}}
.g9-node-map{height:clamp(300px,47svh,400px);max-width:440px}.g9-node-map .map-node{position:absolute;display:flex;font-family:system-ui,sans-serif;font-size:14px;line-height:1.25;min-height:98px;padding:12px 6px;z-index:2;clip-path:none;border-radius:12px;background:linear-gradient(145deg,#334866,#151d32 65%,#27234c);box-shadow:0 8px 25px #05081399,inset 0 1px #a6b5c844,0 0 16px #8275ed33}.map-node strong{font-size:clamp(13px,3.6vw,17px)}.g9-node-map .map-core{z-index:1}.g9-node-map>svg{z-index:0}.final-hub .hub-hero{padding-top:12px}.final-hub .hud-progress-panel{margin-bottom:10px}.g9-node-map .map-node:active{filter:brightness(1.3)}.map-node small{font-size:9px}.data-memory{font-family:monospace}
</style>
</head>
<body>
  <canvas id="bg-tech" aria-hidden="true"></canvas>

  <header id="top-bar" class="top-bar is-hidden">
    <div class="top-bar-group">
      <button type="button" class="chrome-pill" id="btn-hub">Archive Hub</button>
      <span class="mono-tag" id="hud-progress-pill">ARCHIVE: 0 / 24</span>
    </div>
    <div class="top-bar-group">
      <button type="button" class="chrome-pill" id="btn-sound" aria-pressed="false">Audio On</button>
      <button type="button" class="chrome-pill" id="btn-motion" aria-pressed="false">Motion: Full</button>
      <button type="button" class="chrome-pill" id="btn-replay-terminal">Terminal</button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="media-modal" class="media-modal hidden" role="dialog" aria-modal="true" aria-label="G9 memory viewer">
    <button type="button" class="modal-close-btn" id="modal-close" aria-label="Close memory viewer">Close</button>
    <div class="modal-stage" id="modal-stage"></div>
  </div>

  <aside id="egg-toast" class="egg-toast hidden" role="status" aria-live="polite">
    <span class="mono-tag" id="egg-count">SYSTEM SECRET</span>
    <h3 id="egg-title"></h3>
    <p id="egg-body" class="muted"></p>
    <button type="button" class="btn-tech-outline" id="egg-close">Acknowledge</button>
  </aside>

  <script type="module" src="./assets/js/app.js?v=lastsave2"></script>
</body>
</html>
